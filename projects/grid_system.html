<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 200vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #eeeeee;
            counter-reset: item;
        }

        .the-grid {
            display: grid;
            grid-template-columns: repeat(5, 200px);
            grid-template-rows: repeat(10, 80px);
            background-color: black;
            padding: 20px;
            grid-template-areas:
                "n1 n1 x1 d1 d1"
                "n1 n1 x2 x2 x2"
                "n2 n2 x2 x2 x2"
                "n3 n3 n3 n3 x3"
                "n4 x4 x4 x4 d2"
                "n4 x4 x4 x4 d3"
                "n4 x4 x4 x4 d4"
                "n5 n5 n5 n5 n5"
                "n6 n6 x5 x5 x5"
                "n7 x6 d5 z f";

            gap: 20px;
        }

        .the-grid div {
            counter-increment: item;
        }

        .the-grid div::after {
            content: counter(item);
            display: flex;
            width: 100%;
            height: 100%;
            justify-content: center;
            align-items: center;
            font-size: 3rem;
            font-weight: bold;
            color: black;
        }

        .the-grid div {
            background-color: rgb(255, 255, 255);
            width: 100%;
            height: 100%;
        }

        .the-grid div:nth-child(1) {
            grid-area: n1;
        }

        .the-grid div:nth-child(2) {
            grid-area: x1;
        }

        .the-grid div:nth-child(3) {
            grid-area: d1;
        }

        .the-grid div:nth-child(4) {
            grid-area: x2;
        }

        .the-grid div:nth-child(5) {
            grid-area: n2;
        }

        .the-grid div:nth-child(6) {
            grid-area: n3;
        }

        .the-grid div:nth-child(7) {
            grid-area: x3;
        }

        .the-grid div:nth-child(8) {
            grid-area: n4;
        }

        .the-grid div:nth-child(9) {
            grid-area: x4;
        }

        .the-grid div:nth-child(10) {
            grid-area: d2;
        }

        .the-grid div:nth-child(11) {
            grid-area: d3;
        }

        .the-grid div:nth-child(12) {
            grid-area: d4;
        }

        .the-grid div:nth-child(13) {
            grid-area: n5;
        }

        .the-grid div:nth-child(14) {
            grid-area: n6;
        }

        .the-grid div:nth-child(15) {
            grid-area: x5;
        }

        .the-grid div:nth-child(16) {
            grid-area: n7;
        }

        .the-grid div:nth-child(17) {
            grid-area: x6;
        }

        .the-grid div:nth-child(18) {
            grid-area: d5;
        }

        .the-grid div:nth-child(19) {
            grid-area: z;
        }

        .the-grid div:nth-child(20) {
            grid-area: f;
        }

        .ads {
            display: grid;
            margin-top: 100px;
            grid-template-columns: repeat(4, 400px);
            grid-template-rows: repeat(3, 200px);
            background-color: rgb(62, 62, 62);
            gap: 20px;
            padding: 60px;
            border-radius: 20px;
        }

        img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .ads div {
            width: 100%;
            height: 100%;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 0 20px 10px rgba(0, 0, 0, 0.1);
        }

        .ads div:nth-child(1) {
            grid-row: span 2;
        }

        .ads div:nth-child(3) {
            grid-column: 3 / span 2;
        }

        .ads div:nth-child(4) {
            grid-row: span 2;
        }

        .ads div:nth-child(8) {
            grid-column: span 2;
        }
