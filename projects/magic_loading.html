<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading Animation</title>

    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;

            width: 100vw;
            height: 100vh;

            background-color: rgb(28, 28, 28);

        }

        .main-wrap {
            width: 300px;
            height: 300px;

            -webkit-box-reflect: below 5px linear-gradient(to top, rgba(255, 0, 0, 0.714), transparent 50%);

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .spinner-wrapper {
            width: 100%;
            height: 100%;

            display: flex;
            justify-content: center;
            align-items: center;

            position: relative;

            animation: rotating 1.2s linear infinite;
        }

        .circle-box {
            width: 100%;
            height: 100%;

            border-radius: 50%;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;
        }

        .loading-container {
            width: 100%;
            height: 100%;

            background-color: black;

            border-radius: 50%;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .loading-container div {
            border-radius: 50%;
        }

        .loading-container::after {
            position: absolute;
            content: '';

            width: 85%;
            height: 85%;

            background-color: black;

            border-radius: 50%;
        }

        .loading-container div:nth-child(1) {
            background: linear-gradient(to bottom, rgba(0, 255, 0, 0.839), transparent);

            width: 50%;
            height: 100%;

            position: relative;
        }

        .loading-container div:nth-child(2) {
            background: linear-gradient(to bottom, transparent, rgba(0, 234, 255, 0.687));

            width: 50%;
            height: 100%;

            position: relative;
        }

        .spinner-wrapper::before {
            position: absolute;
            content: '';

            width: 25px;
            height: 25px;

            border-radius: 50%;

            background-color: rgb(0, 255, 0);

            box-shadow:
                0 0 10px 1px rgb(0, 255, 0),
                0 0 20px 2px rgb(0, 255, 0),
                0 0 30px 3px rgb(0, 255, 0),
                0 0 40px 4px rgb(0, 255, 0);

            z-index: 99999;

            top: 0;
            right: 60%;

            filter: brightness(4);
        }

        .spinner-wrapper::after {
            position: absolute;
            content: '';

            width: 25px;
            height: 25px;

            border-radius: 50%;

            background-color: rgb(0, 234, 255);

            box-shadow:
                0 0 10px 1px rgb(0, 234, 255),
                0 0 20px 2px rgb(0, 234, 255),
                0 0 30px 3px rgb(0, 234, 255),
                0 0 40px 4px rgb(0, 234, 255);

            z-index: 99999;

            bottom: 0;
            left: 60%;

            filter: brightness(4);
        }

        @keyframes rotating {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }
    </style>

</head>

<body>

    <div class="main-wrap">

        <div class="spinner-wrapper">

            <div class="circle-box">

                <div class="loading-container">
                    <div></div>
                    <div></div>
                </div>

            </div>

        </div>

    </div>

</body>

</html>
